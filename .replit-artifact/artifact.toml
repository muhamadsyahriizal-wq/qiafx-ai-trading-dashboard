kind = "web"
previewPath = "/"
title = "AI Trading Dashboard"
description = "A Telegram Mini App for BTC/USDT market intelligence, AI trading signals, and safe paper trading with portfolio and trade history tracking."
version = "1.0.0"
id = "artifacts/ai-trading-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22434

[services.development]
run = "pnpm --filter @workspace/ai-trading-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-trading-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-trading-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22434"
BASE_PATH = "/"
