name: Extract QFX Project

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract actual QFX app
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MENCARI PROJECT QFX"
          echo "======================================"

          rm -rf extracted testzip
          mkdir -p extracted testzip

          FOUND_ZIP=""
          FOUND_APP=""

          for ZIP in *.zip; do
            [ -f "$ZIP" ] || continue

            echo ""
            echo "Memeriksa ZIP: $ZIP"

            rm -rf testzip
            mkdir -p testzip

            if ! unzip -q "$ZIP" -d testzip; then
              echo "ZIP tidak valid, dilewati: $ZIP"
              continue
            fi

            echo "Mencari vite.config.ts + index.html + package.json..."

            CANDIDATE=""

            while IFS= read -r VITE_FILE; do
              DIR="$(dirname "$VITE_FILE")"

              if [ -f "$DIR/index.html" ] && [ -f "$DIR/package.json" ]; then
                CANDIDATE="$DIR"
                break
              fi
            done < <(find testzip -type f -name "vite.config.ts")

            if [ -n "$CANDIDATE" ]; then
              FOUND_ZIP="$ZIP"
              FOUND_APP="$CANDIDATE"

              echo ""
              echo "======================================"
              echo "PROJECT QFX DITEMUKAN"
              echo "ZIP   : $FOUND_ZIP"
              echo "FOLDER: $FOUND_APP"
              echo "======================================"

              break
            fi
          done

          if [ -z "$FOUND_ZIP" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: PROJECT QFX TIDAK DITEMUKAN"
            echo "======================================"

            echo "Daftar ZIP:"
            ls -lh *.zip 2>/dev/null || true

            echo ""
            echo "Isi file yang ditemukan:"
            find testzip -maxdepth 5 -type f | head -100 || true

            exit 1
          fi

          echo ""
          echo "Mengekstrak project dari:"
          echo "$FOUND_ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$FOUND_ZIP" -d extracted

          APP_DIR=""

          while IFS= read -r VITE_FILE; do
            DIR="$(dirname "$VITE_FILE")"

            if [ -f "$DIR/index.html" ] && [ -f "$DIR/package.json" ]; then
              APP_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name "vite.config.ts")

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Folder aplikasi tidak ditemukan setelah ekstraksi."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "FOLDER APLIKASI:"
          echo "$APP_DIR"
          echo "======================================"

          echo ""
          echo "Isi project:"
          ls -la "$APP_DIR"

          echo ""
          echo "Membersihkan root repository..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            ! -name "extracted" \
            ! -name "testzip" \
            -exec rm -rf {} +

          echo ""
          echo "Menyalin project QFX ke root repository..."

          cp -a "$APP_DIR"/. ./

          echo ""
          echo "Memastikan file utama tersedia..."

          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -d src

          echo ""
          echo "======================================"
          echo "PROJECT QFX BERHASIL DIEKSTRAK"
          echo "======================================"

          echo ""
          echo "File root:"
          ls -la

          echo ""
          echo "Folder src:"
          ls -la src

          rm -rf extracted testzip

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFIKASI PROJECT"
          echo "======================================"

          if [ ! -f package.json ]; then
            echo "ERROR: package.json tidak ada."
            exit 1
          fi

          if [ ! -f vite.config.ts ]; then
            echo "ERROR: vite.config.ts tidak ada."
            exit 1
          fi

          if [ ! -f index.html ]; then
            echo "ERROR: index.html tidak ada."
            exit 1
          fi

          if [ ! -d src ]; then
            echo "ERROR: folder src tidak ada."
            exit 1
          fi

          echo "package.json ditemukan."
          echo "vite.config.ts ditemukan."
          echo "index.html ditemukan."
          echo "src ditemukan."

          echo ""
          echo "Isi package.json:"
          cat package.json

          echo ""
          echo "======================================"
          echo "VERIFIKASI BERHASIL"
          echo "======================================"

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Menambahkan perubahan..."

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Fix QFX project root"

          echo "Mengambil perubahan terbaru dari GitHub..."

          git pull --rebase origin main

          echo "Push project QFX..."

          git push origin main

          echo ""
          echo "======================================"
          echo "PROJECT QFX BERHASIL DI-PUSH"
          echo "======================================"
