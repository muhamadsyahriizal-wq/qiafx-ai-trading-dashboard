name: Prepare QFX Project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # =========================================================
      # 2. INSTALL EXTRACTION TOOLS
      # =========================================================
      - name: Install extraction tools
        shell: bash
        run: |
          set -u

          sudo apt-get update
          sudo apt-get install -y unzip

          echo "Extraction tools ready."

      # =========================================================
      # 3. FIND APPLICATION ZIP
      # =========================================================
      - name: Find application ZIP
        shell: bash
        run: |
          set -u

          echo "Searching for application ZIP..."

          ZIP_FILE=""

          while IFS= read -r -d '' FILE; do

            echo ""
            echo "Checking:"
            echo "$FILE"

            if unzip -l "$FILE" 2>/dev/null | grep -q "vite.config.ts"; then

              if unzip -l "$FILE" 2>/dev/null | grep -q "index.html"; then

                if unzip -l "$FILE" 2>/dev/null | grep -q "package.json"; then

                  ZIP_FILE="$FILE"
                  break

                fi

              fi

            fi

          done < <(
            find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print0
          )

          if [ -z "$ZIP_FILE" ]; then

            echo ""
            echo "ERROR: Application ZIP was not found."

            echo ""
            echo "Available ZIP files:"

            find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "SELECTED ZIP"
          echo "======================================"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # =========================================================
      # 4. EXTRACT APPLICATION ZIP
      # =========================================================
      - name: Extract application ZIP
        shell: bash
        run: |
          set -u

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted \
            > /tmp/unzip.log 2>&1

          UNZIP_CODE=$?

          cat /tmp/unzip.log

          if [ "$UNZIP_CODE" -ne 0 ]; then

            echo ""
            echo "WARNING: unzip returned code $UNZIP_CODE."
            echo "Continuing to inspect extracted files."

          fi

          test -d extracted

          echo ""
          echo "Extraction finished."

      # =========================================================
      # 5. REMOVE NESTED GIT METADATA
      # =========================================================
      - name: Remove nested Git metadata
        shell: bash
        run: |
          set -u

          find extracted \
            -type d \
            -name ".git" \
            -prune \
            -exec rm -rf {} + \
            2>/dev/null || true

          find extracted \
            -type f \
            -name ".gitmodules" \
            -delete \
            2>/dev/null || true

          find extracted \
            -type f \
            -name ".git" \
            -delete \
            2>/dev/null || true

          echo "Nested Git cleanup finished."

      # =========================================================
      # 6. INSPECT EXTRACTED PROJECT
      # =========================================================
      - name: Inspect extracted project
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "EXTRACTED DIRECTORIES"
          echo "======================================"

          find extracted \
            -maxdepth 5 \
            -type d \
            -not -path "*/node_modules*" \
            | head -300

          echo ""
          echo "======================================"
          echo "PROJECT FILES"
          echo "======================================"

          find extracted \
            -maxdepth 7 \
            -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            | head -400

      # =========================================================
      # 7. LOCATE VITE APPLICATION
      # =========================================================
      - name: Locate Vite application
        shell: bash
        run: |
          set -u

          APP_DIR=""

          while IFS= read -r -d '' VITE_FILE; do

            DIR="$(dirname "$VITE_FILE")"

            if [ -f "$DIR/index.html" ] &&
               [ -f "$DIR/package.json" ]; then

              APP_DIR="$DIR"
              break

            fi

          done < <(
            find extracted \
              -type f \
              -name "vite.config.ts" \
              -not -path "*/node_modules/*" \
              -print0
          )

          if [ -z "$APP_DIR" ]; then

            echo ""
            echo "ERROR: Vite application was not found."

            echo ""
            echo "vite.config.ts files:"

            find extracted \
              -type f \
              -name "vite.config.ts" \
              -print

            echo ""
            echo "package.json files:"

            find extracted \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "APPLICATION FOUND"
          echo "======================================"
          echo "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 8. FIND API CLIENT WORKSPACE PACKAGE
      # =========================================================
      - name: Find API client workspace package
        shell: bash
        run: |
          set -u

          API_PACKAGE_DIR=""

          echo ""
          echo "Searching for @workspace/api-client-react..."

          while IFS= read -r -d '' PACKAGE_FILE; do

            NAME="$(
              node -e '
                const fs = require("fs");

                try {
                  const pkg = JSON.parse(
                    fs.readFileSync(process.argv[1], "utf8")
                  );

                  process.stdout.write(pkg.name || "");

                } catch {
                  process.stdout.write("");
                }
              ' "$PACKAGE_FILE"
            )"

            if [ "$NAME" = "@workspace/api-client-react" ]; then

              API_PACKAGE_DIR="$(dirname "$PACKAGE_FILE")"
              break

            fi

          done < <(
            find extracted \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print0
          )

          if [ -z "$API_PACKAGE_DIR" ]; then

            echo ""
            echo "======================================"
            echo "ERROR: API CLIENT NOT FOUND"
            echo "======================================"

            find extracted \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "API CLIENT FOUND"
          echo "======================================"
          echo "$API_PACKAGE_DIR"

          echo "API_PACKAGE_DIR=$API_PACKAGE_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 9. PREPARE API CLIENT PACKAGE
      # =========================================================
      - name: Prepare API client package
        shell: bash
        run: |
          set -u

          rm -rf packages
          mkdir -p packages

          cp -R \
            "$API_PACKAGE_DIR" \
            "packages/api-client-react"

          echo ""
          echo "API client prepared."

          find packages/api-client-react \
            -maxdepth 5 \
            -type f \
            | head -300

      # =========================================================
      # 10. COPY APPLICATION TO REPOSITORY ROOT
      # =========================================================
      - name: Copy application to repository root
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "PREPARING REPOSITORY ROOT"
          echo "======================================"

          mkdir -p .qfx-temp

          if [ -f "AI-Trading-Dashboard.zip" ]; then

            cp \
              "AI-Trading-Dashboard.zip" \
              ".qfx-temp/AI-Trading-Dashboard.zip"

          fi

          rm -rf ".qfx-temp/api-client-react"

          cp -R \
            "packages/api-client-react" \
            ".qfx-temp/api-client-react"

          test -d "$APP_DIR"
          test -f "$APP_DIR/package.json"
          test -f "$APP_DIR/index.html"
          test -f "$APP_DIR/vite.config.ts"

          echo ""
          echo "Application source:"
          echo "$APP_DIR"

          echo ""
          echo "Cleaning old root files..."

          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".gitignore" \
            ! -name ".qfx-temp" \
            ! -name "extracted" \
            -exec rm -rf {} + \
            2>/dev/null || true

          echo ""
          echo "Copying application..."

          cp -R \
            "$APP_DIR"/. \
            .

          echo ""
          echo "Restoring API client..."

          mkdir -p packages

          rm -rf packages/api-client-react

          cp -R \
            ".qfx-temp/api-client-react" \
            "packages/api-client-react"

          if [ -f ".qfx-temp/AI-Trading-Dashboard.zip" ]; then

            cp \
              ".qfx-temp/AI-Trading-Dashboard.zip" \
              "AI-Trading-Dashboard.zip"

          fi

          echo ""
          echo "Application copied successfully."

      # =========================================================
      # 11. FINAL GIT CLEANUP
      # =========================================================
      - name: Final Git cleanup
        shell: bash
        run: |
          set -u

          echo "Removing nested Git metadata..."

          find . \
            -mindepth 2 \
            -type d \
            -name ".git" \
            -prune \
            -exec rm -rf {} + \
            2>/dev/null || true

          find . \
            -type f \
            -name ".gitmodules" \
            -not -path "./.git/*" \
            -delete \
            2>/dev/null || true

          echo "Git cleanup complete."

      # =========================================================
      # 12. FIX WORKSPACE DEPENDENCY
      # =========================================================
      - name: Fix workspace dependency
        shell: bash
        run: |
          set -u

          echo ""
          echo "Fixing workspace dependencies..."

          node <<'NODE'
          const fs = require("fs");

          const file = "package.json";

          const pkg = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          const sections = [
            "dependencies",
            "devDependencies",
            "optionalDependencies"
          ];

          for (const section of sections) {

            if (!pkg[section]) {
              continue;
            }

            if (
              pkg[section]["@workspace/api-client-react"]
            ) {

              pkg[section]["@workspace/api-client-react"] =
                "file:./packages/api-client-react";

              console.log(
                "Converted @workspace/api-client-react"
              );
            }
          }

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );
          NODE

          echo ""
          echo "API client dependency:"

          grep -n \
            "api-client-react" \
            package.json || true

      # =========================================================
      # 13. RESOLVE ALL CATALOG DEPENDENCIES
      # =========================================================
      - name: Resolve all catalog dependencies
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "RESOLVING CATALOG DEPENDENCIES"
          echo "======================================"

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const packageFiles = [];

          function scan(dir) {

            if (!fs.existsSync(dir)) {
              return;
            }

            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {

              if (
                entry.name === "node_modules" ||
                entry.name === ".git" ||
                entry.name === "dist" ||
                entry.name === "build"
              ) {
                continue;
              }

              const fullPath =
                path.join(dir, entry.name);

              if (entry.isDirectory()) {
                scan(fullPath);
              }

              if (
                entry.isFile() &&
                entry.name === "package.json"
              ) {
                packageFiles.push(fullPath);
              }
            }
          }

          scan(".");

          const files = [
            ...new Set(packageFiles)
          ];

          const sections = [
            "dependencies",
            "devDependencies",
            "optionalDependencies",
            "peerDependencies"
          ];

          for (const file of files) {

            let pkg;

            try {

              pkg = JSON.parse(
                fs.readFileSync(file, "utf8")
              );

            } catch {

              continue;

            }

            let changed = false;

            for (const section of sections) {

              if (!pkg[section]) {
                continue;
              }

              for (
                const [name, value]
                of Object.entries(pkg[section])
              ) {

                if (
                  typeof value === "string" &&
                  value.startsWith("catalog:")
                ) {

                  console.log(
                    `Replacing ${name}=${value} in ${file}`
                  );

                  pkg[section][name] = "latest";

                  changed = true;
                }
              }
            }

            if (changed) {

              fs.writeFileSync(
                file,
                JSON.stringify(pkg, null, 2) + "\n"
              );

            }
          }

          console.log("");
          console.log("Catalog dependency cleanup finished.");
          NODE

          echo ""
          echo "Checking for remaining catalog references..."

          if grep -R \
            "catalog:" \
            package.json \
            packages/*/package.json \
            2>/dev/null; then

            echo ""
            echo "ERROR: catalog dependency still exists."

            exit 1

          else

            echo ""
            echo "SUCCESS: no catalog dependencies remain."

          fi

      # =========================================================
      # 14. CREATE STANDALONE TYPESCRIPT CONFIGURATION
      # =========================================================
      - name: Create standalone TypeScript configuration
        shell: bash
        run: |
          set -u

          echo ""
          echo "Creating standalone tsconfig.json..."

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "useDefineForClassFields": true,
              "lib": [
                "ES2022",
                "DOM",
                "DOM.Iterable"
              ],
              "allowJs": false,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "strict": true,
              "forceConsistentCasingInFileNames": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "types": [
                "node",
                "vite/client"
              ],
              "paths": {
                "@/*": [
                  "./src/*"
                ],
                "@workspace/api-client-react": [
                  "./packages/api-client-react"
                ]
              }
            },
            "include": [
              "src/**/*",
              "vite.config.ts",
              "mockupPreviewPlugin.ts"
            ],
            "exclude": [
              "node_modules",
              "dist",
              "build",
              "**/*.test.ts",
              "**/*.test.tsx"
            ]
          }
          EOF

          echo ""
          echo "Standalone tsconfig.json created."

          cat tsconfig.json

      # =========================================================
      # 15. FIX TYPECHECK SCRIPT
      # =========================================================
      - name: Fix typecheck script
        shell: bash
        run: |
          set -u

          node <<'NODE'
          const fs = require("fs");

          const file = "package.json";

          const pkg = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          if (!pkg.scripts) {
            pkg.scripts = {};
          }

          pkg.scripts.typecheck =
            "tsc -p tsconfig.json --noEmit";

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );
          NODE

          echo "Typecheck script fixed."

      # =========================================================
      # 16. VERIFY PROJECT STRUCTURE
      # =========================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "PROJECT CHECK"
          echo "======================================"

          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f tsconfig.json
          test -d src
          test -d packages/api-client-react
          test -f packages/api-client-react/package.json

          echo ""
          echo "All required files exist."

      # =========================================================
      # 17. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "NPM INSTALL"
          echo "======================================"

          npm install --legacy-peer-deps

      # =========================================================
      # 18. TYPESCRIPT CHECK
      # =========================================================
      - name: TypeScript typecheck
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "TYPESCRIPT CHECK"
          echo "======================================"

          npx tsc \
            -p tsconfig.json \
            --noEmit \
            --skipLibCheck

      # =========================================================
      # 19. PRODUCTION BUILD
      # =========================================================
      - name: Production build
        shell: bash
        env:
          PORT: "5173"
          BASE_PATH: "/"
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "PRODUCTION BUILD"
          echo "======================================"

          echo "PORT=$PORT"
          echo "BASE_PATH=$BASE_PATH"

          npm run build

      # =========================================================
      # 20. CLEAN TEMPORARY FILES
      # =========================================================
      - name: Clean temporary files
        shell: bash
        run: |
          set -u

          rm -rf .qfx-temp
          rm -rf extracted

          echo "Temporary files removed."

      # =========================================================
      # 21. FINAL PROJECT VERIFICATION
      # =========================================================
      - name: Final project verification
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "FINAL QFX PROJECT"
          echo "======================================"

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "API client:"
          ls -la packages/api-client-react

          echo ""
          echo "Build output:"
          ls -la dist 2>/dev/null || true

          echo ""
          echo "QFX project verification complete."

      # =========================================================
      # 22. COMMIT PREPARED PROJECT
      # =========================================================
      - name: Commit prepared project
        shell: bash
        run: |
          set -u

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Prepare QFX dashboard for Cloudflare"

            git push

          fi
