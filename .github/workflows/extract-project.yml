name: Prepare QFX Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify QFX project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFY QFX PROJECT"
          echo "========================================"

          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -d src

          echo "package.json      OK"
          echo "index.html        OK"
          echo "vite.config.ts    OK"
          echo "src/              OK"

          echo ""
          echo "Project root:"
          pwd

          echo ""
          echo "Files:"
          ls -la

      - name: Fix TypeScript configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FIX TYPESCRIPT CONFIGURATION"
          echo "========================================"

          if [ -f tsconfig.json ]; then
            echo "tsconfig.json ditemukan"

            if grep -q '"./tsconfig.base.json"' tsconfig.json 2>/dev/null; then
              echo "tsconfig.json membutuhkan tsconfig.base.json"
            fi
          else
            echo "tsconfig.json belum ada, membuat konfigurasi baru"
          fi

          cat > tsconfig.base.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "useDefineForClassFields": true,
              "lib": ["ES2022", "DOM", "DOM.Iterable"],
              "allowJs": false,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "strict": true,
              "forceConsistentCasingInFileNames": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx"
            }
          }
          EOF

          echo "tsconfig.base.json siap"

      - name: Check package configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECK PACKAGE"
          echo "========================================"

          node -e "
          const p=require('./package.json');
          console.log('name:', p.name);
          console.log('scripts:', p.scripts);
          "

          if grep -R '"catalog:' package.json packages 2>/dev/null; then
            echo "ERROR: catalog dependency masih ditemukan"
            exit 1
          fi

          echo "Tidak ada catalog dependency."

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALL DEPENDENCIES"
          echo "========================================"

          npm install --no-audit --no-fund

      - name: Typecheck
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "TYPECHECK"
          echo "========================================"

          npm run typecheck

      - name: Production build
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PRODUCTION BUILD"
          echo "========================================"

          npm run build

          test -d dist

          echo ""
          echo "BUILD BERHASIL"
          echo ""
          find dist -maxdepth 2 -type f | head -50

      - name: Final verification
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINAL VERIFICATION"
          echo "========================================"

          test -f package.json
          test -f index.html
          test -d src
          test -d dist

          echo ""
          echo "========================================"
          echo "QFX PROJECT READY"
          echo "========================================"
          echo "Typecheck : PASS"
          echo "Build     : PASS"
          echo "Dist      : EXISTS"
          echo "========================================"
