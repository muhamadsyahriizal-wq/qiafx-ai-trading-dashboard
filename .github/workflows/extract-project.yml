name: Prepare QFX Project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # =========================================================
      # 2. INSTALL TOOLS
      # =========================================================
      - name: Install extraction tools
        shell: bash
        run: |
          set -u

          sudo apt-get update
          sudo apt-get install -y unzip

          echo "Tools ready."

      # =========================================================
      # 3. FIND APPLICATION ZIP
      # =========================================================
      - name: Find application ZIP
        shell: bash
        run: |
          set -u

          echo "Searching for application ZIP..."

          ZIP_FILE=""

          while IFS= read -r -d '' FILE; do
            echo ""
            echo "Checking:"
            echo "$FILE"

            if unzip -l "$FILE" 2>/dev/null | grep -q "vite.config.ts"; then
              if unzip -l "$FILE" 2>/dev/null | grep -q "index.html"; then
                if unzip -l "$FILE" 2>/dev/null | grep -q "package.json"; then
                  ZIP_FILE="$FILE"
                  break
                fi
              fi
            fi

          done < <(
            find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print0
          )

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Application ZIP was not found."
            echo ""
            echo "ZIP files found:"
            find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "SELECTED ZIP"
          echo "======================================"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # =========================================================
      # 4. EXTRACT APPLICATION ZIP
      # =========================================================
      - name: Extract application ZIP
        shell: bash
        run: |
          set -u

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted > /tmp/unzip.log 2>&1
          UNZIP_CODE=$?

          cat /tmp/unzip.log

          if [ "$UNZIP_CODE" -ne 0 ]; then
            echo ""
            echo "WARNING: unzip returned code $UNZIP_CODE."
            echo "Continuing to inspect extracted files."
          fi

          if [ ! -d extracted ]; then
            echo "ERROR: extracted directory does not exist."
            exit 1
          fi

          echo ""
          echo "Extraction finished."

      # =========================================================
      # 5. REMOVE NESTED GIT
      # =========================================================
      - name: Remove nested Git metadata
        shell: bash
        run: |
          set -u

          echo "Removing nested Git repositories..."

          find extracted \
            -type d \
            -name ".git" \
            -prune \
            -exec rm -rf {} + 2>/dev/null || true

          find extracted \
            -type f \
            -name ".gitmodules" \
            -delete 2>/dev/null || true

          find extracted \
            -type f \
            -name ".git" \
            -delete 2>/dev/null || true

          echo "Nested Git cleanup finished."

      # =========================================================
      # 6. INSPECT EXTRACTED PROJECT
      # =========================================================
      - name: Inspect extracted project
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "EXTRACTED DIRECTORIES"
          echo "======================================"

          find extracted \
            -maxdepth 5 \
            -type d \
            -not -path "*/node_modules*" \
            | head -300

          echo ""
          echo "======================================"
          echo "PROJECT FILES"
          echo "======================================"

          find extracted \
            -maxdepth 7 \
            -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            | head -400

      # =========================================================
      # 7. LOCATE VITE APPLICATION
      # =========================================================
      - name: Locate Vite application
        shell: bash
        run: |
          set -u

          APP_DIR=""

          echo ""
          echo "Searching for Vite application..."

          while IFS= read -r -d '' VITE_FILE; do

            DIR="$(dirname "$VITE_FILE")"

            if [ -f "$DIR/index.html" ] &&
               [ -f "$DIR/package.json" ]; then

              APP_DIR="$DIR"
              break

            fi

          done < <(
            find extracted \
              -type f \
              -name "vite.config.ts" \
              -not -path "*/node_modules/*" \
              -print0
          )

          if [ -z "$APP_DIR" ]; then
            echo ""
            echo "ERROR: Vite application was not found."

            echo ""
            echo "vite.config.ts files:"
            find extracted \
              -type f \
              -name "vite.config.ts" \
              -not -path "*/node_modules/*" \
              -print

            echo ""
            echo "package.json files:"
            find extracted \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APPLICATION FOUND"
          echo "======================================"
          echo "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 8. FIND API CLIENT
      # =========================================================
      - name: Find API client workspace package
        shell: bash
        run: |
          set -u

          API_PACKAGE_DIR=""

          echo ""
          echo "Searching for @workspace/api-client-react..."

          while IFS= read -r -d '' PACKAGE_FILE; do

            NAME="$(
              node -e '
                const fs = require("fs");

                try {
                  const file = process.argv[1];

                  const pkg = JSON.parse(
                    fs.readFileSync(file, "utf8")
                  );

                  process.stdout.write(pkg.name || "");
                } catch (error) {
                  process.stdout.write("");
                }
              ' "$PACKAGE_FILE"
            )"

            if [ "$NAME" = "@workspace/api-client-react" ]; then
              API_PACKAGE_DIR="$(dirname "$PACKAGE_FILE")"
              break
            fi

          done < <(
            find extracted \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print0
          )

          if [ -z "$API_PACKAGE_DIR" ]; then

            echo ""
            echo "======================================"
            echo "ERROR: API CLIENT NOT FOUND"
            echo "======================================"

            echo ""
            echo "Available package.json files:"

            find extracted \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "API CLIENT FOUND"
          echo "======================================"
          echo "$API_PACKAGE_DIR"

          echo "API_PACKAGE_DIR=$API_PACKAGE_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 9. PREPARE API CLIENT
      # =========================================================
      - name: Prepare API client package
        shell: bash
        run: |
          set -u

          rm -rf packages
          mkdir -p packages

          cp -R \
            "$API_PACKAGE_DIR" \
            "packages/api-client-react"

          echo ""
          echo "API client copied successfully."

          echo ""
          echo "API client files:"

          find packages/api-client-react \
            -maxdepth 5 \
            -type f \
            | head -300

      # =========================================================
      # 10. COPY APPLICATION TO ROOT
      #
      # IMPORTANT:
      # extracted MUST NOT be deleted before this step.
      # =========================================================
      - name: Copy application to repository root
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "PREPARING REPOSITORY ROOT"
          echo "======================================"

          # Create temporary storage.
          mkdir -p .qfx-temp

          # Save original ZIP.
          if [ -f "AI-Trading-Dashboard.zip" ]; then
            cp \
              "AI-Trading-Dashboard.zip" \
              ".qfx-temp/AI-Trading-Dashboard.zip"
          fi

          # Save API client.
          rm -rf ".qfx-temp/api-client-react"

          cp -R \
            "packages/api-client-react" \
            ".qfx-temp/api-client-react"

          # Verify application source still exists.
          echo ""
          echo "Application source:"
          echo "$APP_DIR"

          if [ ! -d "$APP_DIR" ]; then
            echo ""
            echo "ERROR: Application directory does not exist."
            echo "$APP_DIR"
            exit 1
          fi

          if [ ! -f "$APP_DIR/package.json" ]; then
            echo ""
            echo "ERROR: Application package.json not found."
            exit 1
          fi

          if [ ! -f "$APP_DIR/index.html" ]; then
            echo ""
            echo "ERROR: Application index.html not found."
            exit 1
          fi

          if [ ! -f "$APP_DIR/vite.config.ts" ]; then
            echo ""
            echo "ERROR: Application vite.config.ts not found."
            exit 1
          fi

          echo ""
          echo "Application source is valid."

          # -------------------------------------------------------
          # Remove old root application files.
          #
          # IMPORTANT:
          # .git, .github, .qfx-temp and extracted are preserved.
          # -------------------------------------------------------
          echo ""
          echo "Cleaning old root files..."

          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".gitignore" \
            ! -name ".qfx-temp" \
            ! -name "extracted" \
            -exec rm -rf {} + 2>/dev/null || true

          # -------------------------------------------------------
          # Copy application.
          # -------------------------------------------------------
          echo ""
          echo "Copying application..."

          cp -R \
            "$APP_DIR"/. \
            .

          # -------------------------------------------------------
          # Restore API client.
          # -------------------------------------------------------
          echo ""
          echo "Restoring API client..."

          mkdir -p packages

          rm -rf packages/api-client-react

          cp -R \
            ".qfx-temp/api-client-react" \
            "packages/api-client-react"

          # -------------------------------------------------------
          # Restore original ZIP.
          # -------------------------------------------------------
          if [ -f ".qfx-temp/AI-Trading-Dashboard.zip" ]; then

            cp \
              ".qfx-temp/AI-Trading-Dashboard.zip" \
              "AI-Trading-Dashboard.zip"

          fi

          echo ""
          echo "Application copied successfully."

      # =========================================================
      # 11. FINAL GIT CLEANUP
      # =========================================================
      - name: Final Git cleanup
        shell: bash
        run: |
          set -u

          echo "Removing nested Git metadata..."

          find . \
            -mindepth 2 \
            -type d \
            -name ".git" \
            -prune \
            -exec rm -rf {} + 2>/dev/null || true

          find . \
            -type f \
            -name ".gitmodules" \
            -not -path "./.git/*" \
            -delete 2>/dev/null || true

          echo "Git cleanup complete."

      # =========================================================
      # 12. FIX WORKSPACE DEPENDENCY
      # =========================================================
      - name: Fix workspace dependency
        shell: bash
        run: |
          set -u

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          node <<'NODE'
          const fs = require("fs");

          const file = "package.json";

          const pkg = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          const sections = [
            "dependencies",
            "devDependencies",
            "optionalDependencies"
          ];

          let found = false;

          for (const section of sections) {

            if (!pkg[section]) {
              continue;
            }

            if (
              pkg[section]["@workspace/api-client-react"]
            ) {

              pkg[section]["@workspace/api-client-react"] =
                "file:./packages/api-client-react";

              found = true;
            }
          }

          if (!found) {
            console.log(
              "WARNING: @workspace/api-client-react was not found."
            );
          }

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );
          NODE

          echo ""
          echo "API client dependency:"
          grep -n \
            "api-client-react" \
            package.json || true

      # =========================================================
      # 13. CHECK WORKSPACE DEPENDENCIES
      # =========================================================
      - name: Check workspace dependencies
        shell: bash
        run: |
          set -u

          echo ""
          echo "Checking application package.json..."

          if grep -n "workspace:" package.json; then
            echo ""
            echo "WARNING: workspace dependency still exists."
          else
            echo "No workspace dependency in application."
          fi

          echo ""
          echo "Checking API client package.json..."

          if [ -f packages/api-client-react/package.json ]; then

            if grep -n \
              "workspace:" \
              packages/api-client-react/package.json; then

              echo ""
              echo "WARNING: API client contains workspace dependencies."

            else

              echo "No workspace dependency in API client."

            fi

          fi

      # =========================================================
      # 14. VERIFY PROJECT
      # =========================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "ROOT FILES"
          echo "======================================"

          ls -la

          echo ""
          echo "======================================"
          echo "SOURCE FILES"
          echo "======================================"

          find src \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -400

          echo ""
          echo "======================================"
          echo "API CLIENT FILES"
          echo "======================================"

          find packages/api-client-react \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

          echo ""
          echo "======================================"
          echo "REQUIRED FILE CHECK"
          echo "======================================"

          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f tsconfig.json
          test -d src
          test -d packages/api-client-react
          test -f packages/api-client-react/package.json

          echo ""
          echo "All required files exist."

      # =========================================================
      # 15. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "NPM INSTALL"
          echo "======================================"

          npm install --legacy-peer-deps

      # =========================================================
      # 16. TYPESCRIPT CHECK
      # =========================================================
      - name: TypeScript typecheck
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "TYPESCRIPT CHECK"
          echo "======================================"

          npm run typecheck

      # =========================================================
      # 17. PRODUCTION BUILD
      # =========================================================
      - name: Production build
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "PRODUCTION BUILD"
          echo "======================================"

          npm run build

      # =========================================================
      # 18. CLEAN TEMPORARY FILES
      # =========================================================
      - name: Clean temporary files
        shell: bash
        run: |
          set -u

          rm -rf .qfx-temp
          rm -rf extracted

          echo "Temporary files removed."

      # =========================================================
      # 19. FINAL VERIFICATION
      # =========================================================
      - name: Final project verification
        shell: bash
        run: |
          set -u

          echo ""
          echo "======================================"
          echo "FINAL QFX PROJECT"
          echo "======================================"

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "API client:"
          ls -la packages/api-client-react

          echo ""
          echo "Build:"
          ls -la dist 2>/dev/null || true

          echo ""
          echo "QFX project verification complete."

      # =========================================================
      # 20. COMMIT
      # =========================================================
      - name: Commit prepared project
        shell: bash
        run: |
          set -u

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Prepare QFX dashboard for Cloudflare"

            git push

          fi
