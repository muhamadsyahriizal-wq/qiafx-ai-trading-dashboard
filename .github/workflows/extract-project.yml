name: Prepare QFX Project

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================
      - name: Install extraction tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip

          echo "Tools siap."

      # ============================================================
      # 3. FIND APPLICATION ZIP
      # ============================================================
      - name: Find application ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI ZIP PROJECT QFX"
          echo "=========================================="

          FOUND_ZIP=""

          for ZIP in ./*.zip; do
            [ -f "$ZIP" ] || continue

            echo ""
            echo "Memeriksa: $ZIP"

            rm -rf /tmp/qfx-test
            mkdir -p /tmp/qfx-test

            unzip -q "$ZIP" -d /tmp/qfx-test

            if find /tmp/qfx-test \
              -type f \
              \( -name "vite.config.ts" -o -name "vite.config.js" \) \
              | grep -q .; then

              FOUND_ZIP="$ZIP"

              echo "ZIP project ditemukan:"
              echo "$FOUND_ZIP"

              break
            fi
          done

          if [ -z "$FOUND_ZIP" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            exit 1
          fi

          echo "FOUND_ZIP=$FOUND_ZIP" >> "$GITHUB_ENV"

      # ============================================================
      # 4. EXTRACT ZIP
      # ============================================================
      - name: Extract QFX project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENGEKSTRAK PROJECT"
          echo "=========================================="

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$FOUND_ZIP" -d extracted

          echo ""
          echo "Isi project:"
          find extracted -maxdepth 5 -type f | head -300

      # ============================================================
      # 5. FIND THE REAL QFX APPLICATION
      # ============================================================
      - name: Locate real QFX application
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI APLIKASI QFX YANG BENAR"
          echo "=========================================="

          APP_DIR=""

          echo ""
          echo "Mencari package.json yang memiliki:"
          echo "- index.html"
          echo "- vite.config"
          echo "- src/App.tsx"
          echo "- src/pages/dashboard.tsx"
          echo "- @workspace/api-client-react"

          while IFS= read -r PKG; do
            DIR="$(dirname "$PKG")"

            echo ""
            echo "Memeriksa kandidat:"
            echo "$DIR"

            if [ ! -f "$DIR/index.html" ]; then
              continue
            fi

            if [ ! -f "$DIR/src/App.tsx" ]; then
              continue
            fi

            if [ ! -f "$DIR/src/pages/dashboard.tsx" ]; then
              continue
            fi

            if [ ! -f "$DIR/vite.config.ts" ] && \
               [ ! -f "$DIR/vite.config.js" ]; then
              continue
            fi

            if grep -R -q "@workspace/api-client-react" \
              "$DIR/src" "$DIR/package.json" 2>/dev/null; then

              APP_DIR="$DIR"

              echo ""
              echo "=========================================="
              echo "QFX ASLI DITEMUKAN"
              echo "=========================================="
              echo "$APP_DIR"

              break
            fi

          done < <(find extracted -type f -name "package.json" | sort)

          # ----------------------------------------------------------
          # Fallback jika pencarian utama gagal
          # ----------------------------------------------------------
          if [ -z "$APP_DIR" ]; then

            echo ""
            echo "Pencarian utama gagal."
            echo "Mencari kandidat berdasarkan dashboard.tsx..."

            while IFS= read -r DASHBOARD; do

              DIR="$(dirname "$DASHBOARD")"

              while [ "$DIR" != "." ] && [ "$DIR" != "/" ]; do

                if [ -f "$DIR/package.json" ] && \
                   [ -f "$DIR/index.html" ] && \
                   [ -f "$DIR/vite.config.ts" ] && \
                   [ -f "$DIR/src/App.tsx" ]; then

                  APP_DIR="$DIR"
                  break 2
                fi

                DIR="$(dirname "$DIR")"
              done

            done < <(
              find extracted \
                -type f \
                -path "*/src/pages/dashboard.tsx" \
                | sort
            )
          fi

          if [ -z "$APP_DIR" ]; then
            echo ""
            echo "ERROR: PROJECT QFX TIDAK DITEMUKAN."
            echo ""
            echo "Kandidat project yang tersedia:"

            find extracted \
              -type f \
              -name "package.json" \
              -print \
              | sort

            echo ""
            echo "Dashboard yang tersedia:"

            find extracted \
              -type f \
              -path "*/src/pages/dashboard.tsx" \
              -print \
              | sort

            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 6. SHOW SELECTED PROJECT
      # ============================================================
      - name: Verify selected QFX project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT QFX TERPILIH"
          echo "=========================================="

          echo "APP_DIR:"
          echo "$APP_DIR"

          echo ""
          echo "App.tsx:"
          sed -n '1,80p' "$APP_DIR/src/App.tsx"

          echo ""
          echo "Dashboard:"
          ls -lh "$APP_DIR/src/pages/dashboard.tsx"

          echo ""
          echo "Package:"
          cat "$APP_DIR/package.json"

      # ============================================================
      # 7. FIND API CLIENT PACKAGE
      # ============================================================
      - name: Locate API client package
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI API CLIENT"
          echo "=========================================="

          API_DIR=""

          # Cari package @workspace/api-client-react
          while IFS= read -r PKG; do

            if grep -q '"name"[[:space:]]*:[[:space:]]*"@workspace/api-client-react"' "$PKG"; then
              API_DIR="$(dirname "$PKG")"

              echo ""
              echo "API CLIENT DITEMUKAN:"
              echo "$API_DIR"

              break
            fi

          done < <(
            find extracted \
              -type f \
              -name "package.json" \
              | sort
          )

          # Cek apakah project terpilih sendiri sudah mempunyai API client
          if [ -d "$APP_DIR/packages/api-client-react" ]; then
            API_DIR="$APP_DIR/packages/api-client-react"
            echo ""
            echo "API client berasal dari project QFX:"
            echo "$API_DIR"
          fi

          if [ -z "$API_DIR" ]; then
            echo ""
            echo "WARNING: API client tidak ditemukan di ZIP."
            echo "Project mungkin tetap menggunakan package yang sudah tersedia."
          else
            echo "API_DIR=$API_DIR" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 8. COPY QFX PROJECT TO ROOT
      # ============================================================
      - name: Copy QFX project to repository root
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENYALIN PROJECT QFX KE ROOT"
          echo "=========================================="

          # Hapus isi repository lama kecuali Git,
          # workflow, dan ZIP sumber.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            ! -name "extracted" \
            -exec rm -rf {} +

          cp -a "$APP_DIR"/. ./

          echo ""
          echo "Project QFX berhasil disalin."

      # ============================================================
      # 9. ENSURE API CLIENT
      # ============================================================
      - name: Ensure API client package
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENYIAPKAN API CLIENT"
          echo "=========================================="

          if [ -d "packages/api-client-react" ]; then
            echo "API client sudah ada:"
            echo "packages/api-client-react"
          elif [ -n "${API_DIR:-}" ] && [ -d "$API_DIR" ]; then
            mkdir -p packages
            cp -a "$API_DIR" packages/api-client-react
            echo "API client berhasil disalin."
          else
            echo "WARNING: API client tidak ditemukan."
          fi

      # ============================================================
      # 10. FIX PACKAGE.JSON
      # ============================================================
      - name: Prepare package.json
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MEMPERBAIKI PACKAGE.JSON"
          echo "=========================================="

          test -f package.json

          node <<'NODE'
          const fs = require("fs");

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

          const sections = [
            "dependencies",
            "devDependencies",
            "optionalDependencies"
          ];

          for (const section of sections) {
            if (!pkg[section]) continue;

            for (const [name, value] of Object.entries(pkg[section])) {

              if (value === "workspace:*") {
                if (name === "@workspace/api-client-react") {
                  pkg[section][name] = "file:./packages/api-client-react";
                  console.log(
                    `${name}: workspace:* -> file:./packages/api-client-react`
                  );
                }
              }

              if (value === "catalog:") {
                console.log(`catalog ditemukan: ${name}`);

                const { execSync } = require("child_process");

                const version = execSync(
                  `npm view "${name}" version`,
                  {
                    encoding: "utf8"
                  }
                ).trim();

                if (!version) {
                  throw new Error(
                    `Tidak dapat menemukan versi npm untuk ${name}`
                  );
                }

                pkg[section][name] = `^${version}`;

                console.log(
                  `${name}: catalog: -> ^${version}`
                );
              }
            }
          }

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );

          console.log("package.json selesai.");
          NODE

          echo ""
          echo "Package API client:"
          grep -n "@workspace/api-client-react" package.json || true

          echo ""
          echo "Memastikan tidak ada catalog:"

          if grep -R '"catalog:"' package.json; then
            echo "ERROR: catalog masih ditemukan."
            exit 1
          fi

      # ============================================================
      # 11. FIX TYPESCRIPT CONFIG
      # ============================================================
      - name: Fix TypeScript configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MEMERIKSA TSCONFIG"
          echo "=========================================="

          if [ -f tsconfig.json ]; then
            echo "tsconfig.json ditemukan."
          else
            echo "Membuat tsconfig.json..."

            cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "useDefineForClassFields": true,
              "lib": [
                "ES2022",
                "DOM",
                "DOM.Iterable"
              ],
              "allowJs": false,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "strict": true,
              "forceConsistentCasingInFileNames": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "incremental": true,
              "types": [
                "node",
                "vite/client"
              ],
              "baseUrl": ".",
              "paths": {
                "@/*": [
                  "./src/*"
                ]
              }
            },
            "include": [
              "src/**/*",
              "mockupPreviewPlugin.ts",
              "vite.config.ts"
            ],
            "exclude": [
              "node_modules",
              "build",
              "dist",
              "**/*.test.ts"
            ]
          }
          EOF
          fi

      # ============================================================
      # 12. VERIFY THAT THIS IS REALLY QFX
      # ============================================================
      - name: Verify QFX application
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFIKASI FINAL PROJECT QFX"
          echo "=========================================="

          test -f package.json
          test -f index.html
          test -f src/App.tsx
          test -f src/pages/dashboard.tsx
          test -f vite.config.ts || test -f vite.config.js

          echo ""
          echo "package.json OK"
          echo "index.html OK"
          echo "src/App.tsx OK"
          echo "src/pages/dashboard.tsx OK"
          echo "vite.config OK"

          echo ""
          echo "Memastikan App.tsx bukan Component Preview Server..."

          if grep -q "Component Preview Server" src/App.tsx; then
            echo ""
            echo "ERROR:"
            echo "App.tsx masih merupakan mockup Component Preview Server."
            echo "Workflow berhenti agar aplikasi salah tidak masuk Cloudflare."
            exit 1
          fi

          echo ""
          echo "App.tsx bukan mockup preview server."

          echo ""
          echo "Memastikan API client digunakan..."

          if grep -R -q "@workspace/api-client-react" src package.json; then
            echo "API client ditemukan."
          else
            echo "ERROR: @workspace/api-client-react tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "VERIFIKASI QFX BERHASIL"
          echo "=========================================="

          echo ""
          echo "Struktur src:"
          find src -maxdepth 3 -type f | sort | head -250

      # ============================================================
      # 13. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL DEPENDENCIES"
          echo "=========================================="

          npm install --legacy-peer-deps

      # ============================================================
      # 14. TYPECHECK
      # ============================================================
      - name: Typecheck
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "TYPECHECK"
          echo "=========================================="

          npx tsc \
            -p tsconfig.json \
            --noEmit \
            --skipLibCheck

      # ============================================================
      # 15. PRODUCTION BUILD
      # ============================================================
      - name: Production build
        shell: bash
        env:
          PORT: "5173"
          BASE_PATH: "/"
        run: |
          set -e

          echo "=========================================="
          echo "PRODUCTION BUILD"
          echo "=========================================="

          echo "PORT=$PORT"
          echo "BASE_PATH=$BASE_PATH"

          npm run build

      # ============================================================
      # 16. FINAL CHECK
      # ============================================================
      - name: Final verification
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          if [ ! -d dist ]; then
            echo "ERROR: dist tidak ditemukan."
            exit 1
          fi

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "dist/ ditemukan."
          echo "dist/index.html ditemukan."

          echo ""
          echo "=========================================="
          echo "QFX PROJECT SIAP DEPLOY"
          echo "=========================================="

      # ============================================================
      # 17. COMMIT PREPARED PROJECT
      # ============================================================
      - name: Commit prepared project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COMMIT PROJECT QFX"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Prepare QFX project"

          git pull --rebase origin main

          git push origin main

          echo ""
          echo "=========================================="
          echo "PROJECT QFX BERHASIL DISIAPKAN"
          echo "=========================================="
