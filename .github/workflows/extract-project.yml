name: Restore QFX Clean Source

on:
  workflow_dispatch:
  push:
    branches:
      - QFX
    paths:
      - "QFX-CLEAN-SOURCE.zip"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QFX
        uses: actions/checkout@v4
        with:
          ref: QFX
          fetch-depth: 0

      - name: Verify clean source ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f "QFX-CLEAN-SOURCE.zip" ]; then
            echo "ERROR: QFX-CLEAN-SOURCE.zip tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh QFX-CLEAN-SOURCE.zip

      - name: Extract clean source
        shell: bash
        run: |
          set -e

          rm -rf /tmp/qfx-clean
          mkdir -p /tmp/qfx-clean

          unzip -q "QFX-CLEAN-SOURCE.zip" -d /tmp/qfx-clean

          echo "Isi hasil ekstraksi:"
          find /tmp/qfx-clean -maxdepth 2 -type f | head -100

      - name: Locate QFX project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "/tmp/qfx-clean/AI-Trading-Dashboard/package.json" ]; then
            PROJECT_DIR="/tmp/qfx-clean/AI-Trading-Dashboard"
          else
            FOUND="$(find /tmp/qfx-clean -type f -path '*/artifacts/ai-trading-dashboard/package.json' -print -quit)"

            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(dirname "$(dirname "$(dirname "$FOUND")")")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/artifacts/ai-trading-dashboard/package.json" ]; then
            echo "ERROR: Project QFX yang benar tidak ditemukan."
            echo "Struktur ZIP:"
            find /tmp/qfx-clean -maxdepth 4 -type f -name "package.json" -print
            exit 1
          fi

          echo "QFX project ditemukan di:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify correct QFX dashboard
        shell: bash
        run: |
          set -e

          APP="$PROJECT_DIR/artifacts/ai-trading-dashboard"

          test -f "$APP/package.json"
          test -f "$APP/vite.config.ts"
          test -f "$APP/src/pages/dashboard.tsx"
          test -f "$PROJECT_DIR/artifacts/api-server/package.json"
          test -f "$PROJECT_DIR/lib/api-client-react/package.json"
          test -f "$PROJECT_DIR/pnpm-workspace.yaml"
          test -f "$PROJECT_DIR/pnpm-lock.yaml"

          if grep -q "Component Preview Server" "$APP/src/pages/dashboard.tsx"; then
            echo "ERROR: Wrong mockup project detected."
            exit 1
          fi

          echo "Correct QFX project verified."

      - name: Replace repository source
        shell: bash
        run: |
          set -e

          echo "Cleaning old project files..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "QFX-CLEAN-SOURCE.zip" \
            -exec rm -rf {} +

          echo "Copying clean QFX source..."

          cp -a "$PROJECT_DIR"/. .

          echo "Removing files that must not remain in the repository..."

          rm -rf .config
          rm -rf .agents
          rm -rf .conversation
          rm -rf node_modules
          rm -rf dist
          rm -rf extracted
          rm -rf packages

          rm -f AI-Trading-Dashboard.zip
          rm -f QFX-CLEAN-SOURCE.zip
          rm -f package-lock.json
          rm -f yarn.lock

          echo "Final repository structure:"
          ls -la

      - name: Verify restored repository
        shell: bash
        run: |
          set -e

          test -f "package.json"
          test -f "pnpm-workspace.yaml"
          test -f "pnpm-lock.yaml"

          test -d "artifacts/ai-trading-dashboard"
          test -f "artifacts/ai-trading-dashboard/package.json"
          test -f "artifacts/ai-trading-dashboard/src/pages/dashboard.tsx"
          test -f "artifacts/ai-trading-dashboard/vite.config.ts"

          test -d "artifacts/api-server"
          test -d "lib/api-client-react"

          if grep -q "Component Preview Server" "src/App.tsx" 2>/dev/null; then
            echo "ERROR: Wrong mockup App.tsx remains at repository root."
            exit 1
          fi

          echo "QFX source restoration verified successfully."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck QFX dashboard
        env:
          PORT: 5173
          BASE_PATH: /
        run: |
          pnpm --filter @workspace/ai-trading-dashboard typecheck

      - name: Build QFX dashboard
        env:
          PORT: 5173
          BASE_PATH: /
        run: |
          pnpm --filter @workspace/ai-trading-dashboard build

      - name: Commit restored QFX source
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Restore complete QFX trading dashboard"

          git push origin QFX
