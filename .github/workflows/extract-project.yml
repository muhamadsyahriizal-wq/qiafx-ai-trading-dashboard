name: Prepare QFX Project

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install extraction tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip

          echo "=========================================="
          echo "TOOLS SIAP"
          echo "=========================================="

      - name: Find application ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI ZIP PROJECT QFX"
          echo "=========================================="

          FOUND_ZIP=""

          for ZIP in ./*.zip; do
            [ -f "$ZIP" ] || continue

            echo ""
            echo "Memeriksa: $ZIP"

            rm -rf /tmp/qfx-test
            mkdir -p /tmp/qfx-test

            unzip -q "$ZIP" -d /tmp/qfx-test

            if find /tmp/qfx-test \
              -type f \
              \( -name "vite.config.ts" -o -name "vite.config.js" \) \
              -print -quit | grep -q .; then

              FOUND_ZIP="$ZIP"

              echo ""
              echo "ZIP PROJECT DITEMUKAN:"
              echo "$FOUND_ZIP"

              break
            fi
          done

          if [ -z "$FOUND_ZIP" ]; then
            echo ""
            echo "ERROR: ZIP PROJECT TIDAK DITEMUKAN."
            exit 1
          fi

          echo "FOUND_ZIP=$FOUND_ZIP" >> "$GITHUB_ENV"

      - name: Extract QFX project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACT PROJECT QFX"
          echo "=========================================="

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$FOUND_ZIP" -d extracted

          echo ""
          echo "PROJECT BERHASIL DI-EXTRACT."

          echo ""
          echo "DAFTAR FILE PROJECT:"

          find extracted \
            -maxdepth 5 \
            -type f \
            ! -path "*/.git/*" \
            -print \
            | sed -n '1,300p'

      - name: Locate real QFX application
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI APLIKASI QFX ASLI"
          echo "=========================================="

          APP_DIR=""

          while IFS= read -r PKG; do

            DIR="$(dirname "$PKG")"

            echo ""
            echo "Memeriksa:"
            echo "$DIR"

            if [ ! -f "$DIR/index.html" ]; then
              continue
            fi

            if [ ! -f "$DIR/src/App.tsx" ]; then
              continue
            fi

            if [ ! -f "$DIR/src/pages/dashboard.tsx" ]; then
              continue
            fi

            if [ ! -f "$DIR/vite.config.ts" ] && \
               [ ! -f "$DIR/vite.config.js" ]; then
              continue
            fi

            if grep -R -q \
              "@workspace/api-client-react" \
              "$DIR/src" \
              "$DIR/package.json" \
              2>/dev/null; then

              APP_DIR="$DIR"

              echo ""
              echo "=========================================="
              echo "QFX ASLI DITEMUKAN"
              echo "=========================================="

              echo "$APP_DIR"

              break
            fi

          done < <(
            find extracted \
              -type f \
              -name "package.json" \
              ! -path "*/.git/*" \
              | sort
          )

          if [ -z "$APP_DIR" ]; then

            echo ""
            echo "PENCARIAN KEDUA BERDASARKAN dashboard.tsx..."

            while IFS= read -r DASHBOARD; do

              DIR="$(dirname "$DASHBOARD")"

              while [ "$DIR" != "." ] && [ "$DIR" != "/" ]; do

                if [ -f "$DIR/package.json" ] && \
                   [ -f "$DIR/index.html" ] && \
                   { [ -f "$DIR/vite.config.ts" ] || [ -f "$DIR/vite.config.js" ]; } && \
                   [ -f "$DIR/src/App.tsx" ]; then

                  APP_DIR="$DIR"

                  break 2
                fi

                DIR="$(dirname "$DIR")"

              done

            done < <(
              find extracted \
                -type f \
                -path "*/src/pages/dashboard.tsx" \
                ! -path "*/.git/*" \
                | sort
            )
          fi

          if [ -z "$APP_DIR" ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: PROJECT QFX TIDAK DITEMUKAN"
            echo "=========================================="

            echo ""
            echo "package.json yang ditemukan:"

            find extracted \
              -type f \
              -name "package.json" \
              ! -path "*/.git/*" \
              -print \
              | sort

            echo ""
            echo "dashboard.tsx yang ditemukan:"

            find extracted \
              -type f \
              -path "*/src/pages/dashboard.tsx" \
              ! -path "*/.git/*" \
              -print \
              | sort

            exit 1
          fi

          echo ""
          echo "APP_DIR:"
          echo "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Verify selected QFX project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFIKASI PROJECT QFX"
          echo "=========================================="

          echo ""
          echo "APP_DIR:"
          echo "$APP_DIR"

          echo ""
          echo "=========================================="
          echo "App.tsx"
          echo "=========================================="

          sed -n '1,120p' "$APP_DIR/src/App.tsx"

          echo ""
          echo "=========================================="
          echo "Dashboard"
          echo "=========================================="

          ls -lh "$APP_DIR/src/pages/dashboard.tsx"

          echo ""
          echo "=========================================="
          echo "package.json"
          echo "=========================================="

          cat "$APP_DIR/package.json"

      - name: Locate API client package
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI API CLIENT"
          echo "=========================================="

          API_DIR=""

          while IFS= read -r PKG; do

            if grep -q \
              '"name"[[:space:]]*:[[:space:]]*"@workspace/api-client-react"' \
              "$PKG"; then

              API_DIR="$(dirname "$PKG")"

              echo ""
              echo "API CLIENT DITEMUKAN:"
              echo "$API_DIR"

              break
            fi

          done < <(
            find extracted \
              -type f \
              -name "package.json" \
              ! -path "*/.git/*" \
              | sort
          )

          if [ -d "$APP_DIR/packages/api-client-react" ]; then
            API_DIR="$APP_DIR/packages/api-client-react"
          fi

          if [ -z "$API_DIR" ]; then

            echo ""
            echo "WARNING: API CLIENT TIDAK DITEMUKAN."

          else

            echo "API_DIR=$API_DIR" >> "$GITHUB_ENV"

          fi

      - name: Copy QFX project to repository root
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENYALIN PROJECT QFX KE ROOT REPOSITORY"
          echo "=========================================="

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            ! -name "extracted" \
            -exec rm -rf {} +

          cp -a "$APP_DIR"/. ./

          echo ""
          echo "PROJECT QFX SUDAH DISALIN KE ROOT."

      - name: Ensure API client package
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MEMASTIKAN API CLIENT ADA"
          echo "=========================================="

          if [ -d "packages/api-client-react" ]; then

            echo "API client sudah ada."

          elif [ -n "${API_DIR:-}" ] && [ -d "$API_DIR" ]; then

            mkdir -p packages

            cp -a "$API_DIR" packages/api-client-react

            echo "API client berhasil disalin."

          else

            echo "WARNING: API client tidak ditemukan."

          fi

      - name: Prepare package.json
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENYIAPKAN PACKAGE.JSON"
          echo "=========================================="

          test -f package.json

          node <<'NODE'
          const fs = require("fs");
          const { execSync } = require("child_process");

          const file = "package.json";

          const pkg = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          const sections = [
            "dependencies",
            "devDependencies",
            "optionalDependencies"
          ];

          for (const section of sections) {

            if (!pkg[section]) {
              continue;
            }

            for (const [name, value] of Object.entries(pkg[section])) {

              if (value === "workspace:*") {

                if (name === "@workspace/api-client-react") {

                  pkg[section][name] =
                    "file:./packages/api-client-react";

                  console.log(
                    `${name}: workspace:* -> file:./packages/api-client-react`
                  );
                }
              }

              if (value === "catalog:") {

                console.log(
                  `Mencari versi npm untuk ${name}...`
                );

                const version = execSync(
                  `npm view "${name}" version`,
                  {
                    encoding: "utf8"
                  }
                ).trim();

                if (!version) {
                  throw new Error(
                    `Tidak dapat menemukan versi npm untuk ${name}`
                  );
                }

                pkg[section][name] = `^${version}`;

                console.log(
                  `${name}: catalog: -> ^${version}`
                );
              }
            }
          }

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );

          console.log("package.json selesai.");
          NODE

          echo ""
          echo "MEMERIKSA catalog: DI PACKAGE.JSON"

          if grep -R \
            '"catalog:"' \
            package.json; then

            echo ""
            echo "ERROR: catalog: masih ditemukan di package.json."

            exit 1
          fi

          echo "Tidak ada catalog: di package.json."

      - name: Remove incompatible lockfiles
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MEMBERSIHKAN LOCKFILE LAMA"
          echo "=========================================="

          rm -f package-lock.json
          rm -f npm-shrinkwrap.json

          echo ""
          echo "package-lock.json lama DIHAPUS."

          echo "npm-shrinkwrap.json lama DIHAPUS jika ada."

          echo ""
          echo "Lockfile baru akan dibuat oleh npm."

      - name: Verify no catalog protocol remains
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MEMERIKSA catalog:"
          echo "=========================================="

          if grep -R \
            "catalog:" \
            . \
            --include="package.json" \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=extracted \
            2>/dev/null; then

            echo ""
            echo "ERROR: catalog: masih ditemukan."
            echo "Periksa package.json."

            exit 1
          fi

          echo ""
          echo "AMAN: tidak ada catalog: pada package.json."

      - name: Fix TypeScript configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MEMERIKSA TSCONFIG"
          echo "=========================================="

          if [ -f tsconfig.json ]; then

            echo "tsconfig.json ditemukan."

          else

            echo "tsconfig.json tidak ditemukan."
            echo "Membuat tsconfig.json..."

            cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "useDefineForClassFields": true,
              "lib": [
                "ES2022",
                "DOM",
                "DOM.Iterable"
              ],
              "allowJs": false,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "strict": true,
              "forceConsistentCasingInFileNames": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "incremental": true,
              "types": [
                "node",
                "vite/client"
              ],
              "baseUrl": ".",
              "paths": {
                "@/*": [
                  "./src/*"
                ]
              }
            },
            "include": [
              "src/**/*",
              "mockupPreviewPlugin.ts",
              "vite.config.ts"
            ],
            "exclude": [
              "node_modules",
              "build",
              "dist",
              "**/*.test.ts"
            ]
          }
          EOF

          fi

      - name: Verify QFX application
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFIKASI AKHIR APLIKASI QFX"
          echo "=========================================="

          test -f package.json
          test -f index.html
          test -f src/App.tsx
          test -f src/pages/dashboard.tsx

          if [ -f vite.config.ts ]; then

            echo "vite.config.ts ditemukan."

          elif [ -f vite.config.js ]; then

            echo "vite.config.js ditemukan."

          else

            echo "ERROR: vite.config tidak ditemukan."

            exit 1

          fi

          if grep -q \
            "Component Preview Server" \
            src/App.tsx; then

            echo ""
            echo "ERROR: App.tsx masih merupakan"
            echo "mockup Component Preview Server."

            exit 1
          fi

          if grep -R -q \
            "@workspace/api-client-react" \
            src package.json; then

            echo ""
            echo "API client ditemukan."

          else

            echo ""
            echo "ERROR: @workspace/api-client-react"
            echo "tidak ditemukan."

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "DAFTAR FILE SRC"
          echo "=========================================="

          find src \
            -maxdepth 3 \
            -type f \
            -print \
            | sort \
            | sed -n '1,250p'

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL DEPENDENCIES"
          echo "=========================================="

          npm install --legacy-peer-deps

      - name: Typecheck
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "TYPECHECK"
          echo "=========================================="

          npx tsc \
            -p tsconfig.json \
            --noEmit \
            --skipLibCheck

      - name: Production build
        shell: bash
        env:
          PORT: "5173"
          BASE_PATH: "/"
        run: |
          set -e

          echo "=========================================="
          echo "PRODUCTION BUILD"
          echo "=========================================="

          npm run build

      - name: Final verification
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="

          test -d dist
          test -f dist/index.html

          echo ""
          echo "=========================================="
          echo "QFX PROJECT SIAP DEPLOY"
          echo "=========================================="

          echo "dist/index.html ditemukan."

      - name: Commit prepared project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COMMIT PROJECT QFX"
          echo "=========================================="

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "Tidak ada perubahan untuk di-commit."

            exit 0

          fi

          git commit \
            -m "Prepare QFX project"

          git pull \
            --rebase \
            origin main

          git push \
            origin main

          echo ""
          echo "=========================================="
          echo "PROJECT QFX BERHASIL DI-PUSH"
          echo "=========================================="
