name: Prepare QFX Project

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract QFX application
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MENCARI PROJECT QFX"
          echo "======================================"

          rm -rf extracted testzip
          mkdir -p extracted testzip

          FOUND_ZIP=""
          FOUND_APP=""

          for ZIP in *.zip; do
            [ -f "$ZIP" ] || continue

            echo ""
            echo "Memeriksa: $ZIP"

            rm -rf testzip
            mkdir -p testzip

            if ! unzip -q "$ZIP" -d testzip; then
              echo "ZIP tidak valid, dilewati."
              continue
            fi

            while IFS= read -r VITE_FILE; do
              DIR="$(dirname "$VITE_FILE")"

              if [ -f "$DIR/index.html" ] && [ -f "$DIR/package.json" ]; then
                FOUND_ZIP="$ZIP"
                FOUND_APP="$DIR"
                break
              fi
            done < <(find testzip -type f -name "vite.config.ts")

            if [ -n "$FOUND_APP" ]; then
              break
            fi
          done

          if [ -z "$FOUND_APP" ]; then
            echo "ERROR: Project QFX tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "PROJECT DITEMUKAN:"
          echo "ZIP   : $FOUND_ZIP"
          echo "FOLDER: $FOUND_APP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$FOUND_ZIP" -d extracted

          APP_DIR=""

          while IFS= read -r VITE_FILE; do
            DIR="$(dirname "$VITE_FILE")"

            if [ -f "$DIR/index.html" ] && [ -f "$DIR/package.json" ]; then
              APP_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name "vite.config.ts")

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Folder aplikasi tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "APP DIR:"
          echo "$APP_DIR"

          echo ""
          echo "Membersihkan root repository..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            ! -name "extracted" \
            ! -name "testzip" \
            -exec rm -rf {} +

          echo ""
          echo "Menyalin aplikasi QFX..."

          cp -a "$APP_DIR"/. ./

          rm -rf extracted testzip

          echo ""
          echo "Project berhasil disalin."

      - name: Fix catalog dependencies
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MEMPERBAIKI DEPENDENCY CATALOG"
          echo "======================================"

          node <<'NODE'
          const fs = require("fs");
          const { execSync } = require("child_process");

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

          const sections = [
            "dependencies",
            "devDependencies",
            "optionalDependencies"
          ];

          for (const section of sections) {
            if (!pkg[section]) continue;

            for (const [name, value] of Object.entries(pkg[section])) {
              if (value !== "catalog:") continue;

              console.log(`Mencari versi: ${name}`);

              try {
                const version = execSync(
                  `npm view "${name}" version`,
                  { encoding: "utf8" }
                ).trim();

                if (!version) {
                  throw new Error("Versi kosong");
                }

                pkg[section][name] = `^${version}`;

                console.log(`  ${name} -> ^${version}`);
              } catch (error) {
                console.error(`Gagal mendapatkan versi untuk ${name}`);
                throw error;
              }
            }
          }

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );

          console.log("");
          console.log("package.json berhasil diperbaiki.");
          NODE

          echo ""
          echo "Memeriksa apakah catalog: masih ada..."

          if grep -R '"catalog:"' package.json; then
            echo "ERROR: Masih ada dependency catalog:"
            exit 1
          fi

          echo "Tidak ada catalog: lagi."

      - name: Verify QFX project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFIKASI PROJECT"
          echo "======================================"

          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f tsconfig.json
          test -d src

          echo "package.json       OK"
          echo "index.html         OK"
          echo "vite.config.ts     OK"
          echo "tsconfig.json      OK"
          echo "src/                OK"

          echo ""
          echo "Script package.json:"
          node -e "console.log(require('./package.json').scripts)"

          echo ""
          echo "======================================"
          echo "VERIFIKASI BERHASIL"
          echo "======================================"

      - name: Commit prepared project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Prepare QFX for Cloudflare"

          git pull --rebase origin main

          git push origin main

          echo ""
          echo "======================================"
          echo "PROJECT QFX SIAP"
          echo "======================================"
