name: Prepare QFX Project

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract QFX dashboard
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "MENCARI AI TRADING DASHBOARD"
          echo "========================================"

          ZIP_FILE=""

          for ZIP in ./*.zip; do
            [ -f "$ZIP" ] || continue
            echo "ZIP ditemukan: $ZIP"
            ZIP_FILE="$ZIP"
            break
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          APP_DIR="extracted/AI-Trading-Dashboard/artifacts/ai-trading-dashboard"

          if [ ! -f "$APP_DIR/package.json" ]; then
            echo "ERROR: Project AI Trading Dashboard tidak ditemukan."
            echo "Mencari struktur ZIP:"
            find extracted -maxdepth 5 -type f -name "package.json" | sort
            exit 1
          fi

          echo ""
          echo "PROJECT YANG DIPILIH:"
          echo "$APP_DIR"

          echo ""
          echo "========================================"
          echo "MENYALIN PROJECT QFX"
          echo "========================================"

          # Bersihkan project hasil ekstraksi sebelumnya,
          # tetapi jangan hapus GitHub workflow dan file ZIP.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          # Salin aplikasi QFX yang benar ke root repository.
          cp -a "$APP_DIR"/. ./

          # API client workspace dibutuhkan oleh dashboard.
          mkdir -p lib/api-client-react
          cp -a extracted/AI-Trading-Dashboard/lib/api-client-react/. \
            lib/api-client-react/

          echo ""
          echo "Project QFX berhasil disalin."

      - name: Prepare package.json
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "MEMPERBAIKI DEPENDENCY"
          echo "========================================"

          node <<'NODE'
          const fs = require("fs");
          const { execSync } = require("child_process");

          function fixPackage(file) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

            for (const section of [
              "dependencies",
              "devDependencies",
              "optionalDependencies"
            ]) {
              if (!pkg[section]) continue;

              for (const [name, value] of Object.entries(pkg[section])) {
                if (value === "workspace:*") {
                  if (name === "@workspace/api-client-react") {
                    pkg[section][name] = "file:./lib/api-client-react";
                  }
                  continue;
                }

                if (value !== "catalog:") continue;

                console.log(`Mencari versi npm untuk ${name}...`);

                const version = execSync(
                  `npm view "${name}" version`,
                  { encoding: "utf8" }
                ).trim();

                if (!version) {
                  throw new Error(`Versi npm tidak ditemukan: ${name}`);
                }

                pkg[section][name] = `^${version}`;
                console.log(`${name} -> ^${version}`);
              }
            }

            fs.writeFileSync(
              file,
              JSON.stringify(pkg, null, 2) + "\n"
            );
          }

          fixPackage("package.json");

          if (fs.existsSync("lib/api-client-react/package.json")) {
            fixPackage("lib/api-client-react/package.json");
          }
          NODE

          echo ""
          echo "Dependency selesai diperbaiki."

      - name: Fix TypeScript configuration
        shell: bash
        run: |
          set -e

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "useDefineForClassFields": true,
              "lib": [
                "ES2022",
                "DOM",
                "DOM.Iterable"
              ],
              "allowJs": false,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "strict": true,
              "forceConsistentCasingInFileNames": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "incremental": true,
              "types": [
                "node",
                "vite/client"
              ],
              "baseUrl": ".",
              "paths": {
                "@/*": [
                  "./src/*"
                ]
              }
            },
            "include": [
              "src/**/*",
              "lib/**/*",
              "vite.config.ts"
            ],
            "exclude": [
              "node_modules",
              "build",
              "dist",
              "**/*.test.ts"
            ]
          }
          EOF

          echo "tsconfig.json diperbaiki."

      - name: Verify QFX project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFIKASI PROJECT QFX"
          echo "========================================"

          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f tsconfig.json
          test -f src/App.tsx
          test -f src/pages/dashboard.tsx
          test -f lib/api-client-react/package.json

          echo "package.json OK"
          echo "index.html OK"
          echo "vite.config.ts OK"
          echo "tsconfig.json OK"
          echo "src/App.tsx OK"
          echo "src/pages/dashboard.tsx OK"
          echo "api-client-react OK"

          echo ""
          echo "Memastikan bukan Mockup Preview Server..."

          if grep -q "Component Preview Server" src/App.tsx; then
            echo "ERROR: Masih menggunakan Mockup Preview Server."
            exit 1
          fi

          echo "App.tsx adalah aplikasi QFX."

          echo ""
          echo "Memastikan tidak ada catalog: ..."

          if grep -R 'catalog:' package.json lib/api-client-react/package.json; then
            echo "ERROR: catalog dependency masih ada."
            exit 1
          fi

          echo "Tidak ada catalog dependency."

          echo ""
          echo "========================================"
          echo "VERIFIKASI BERHASIL"
          echo "========================================"

      - name: Install dependencies and test build
        shell: bash
        env:
          PORT: "4173"
          BASE_PATH: "/"
        run: |
          set -e

          echo "========================================"
          echo "INSTALL & BUILD QFX"
          echo "========================================"

          npm install
          npm run build

          echo ""
          echo "BUILD QFX BERHASIL."

      - name: Commit prepared QFX project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Fix QFX project root"

          git pull --rebase origin main
          git push origin main

          echo ""
          echo "========================================"
          echo "QFX PROJECT SIAP"
          echo "========================================"
