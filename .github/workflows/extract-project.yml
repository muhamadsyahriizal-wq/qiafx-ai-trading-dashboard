name: Extract QFX Project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f \
            \( -iname "*.zip" \) \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP project tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP="${{ steps.find_zip.outputs.zip }}"

          echo "Mengekstrak: $ZIP"
          unzip -q "$ZIP" -d extracted

          echo "Isi hasil ekstraksi:"
          find extracted -maxdepth 2 -type f | head -100

      - name: Normalize project root
        shell: bash
        run: |
          set -e

          # Cari package.json
          PACKAGE=$(find extracted -name package.json -type f -print -quit || true)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "Project ditemukan di: $PROJECT_DIR"

          # Jika project berada di dalam folder,
          # pindahkan isinya ke root repository.
          if [ "$PROJECT_DIR" != "extracted" ]; then
            cp -a "$PROJECT_DIR"/. extracted/
          fi

          echo "Struktur project:"
          ls -la extracted

      - name: Copy extracted project to repository
        shell: bash
        run: |
          set -e

          # Jangan menimpa folder GitHub Actions
          rm -rf ./*

          cp -a extracted/. ./

          rm -rf extracted

          echo "Repository setelah extraction:"
          ls -la

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi

          git commit -m "Extract QFX project from ZIP"

          # Push menggunakan token GitHub Actions
          git push
