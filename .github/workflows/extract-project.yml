name: Prepare QFX Project

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract QFX dashboard
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "MENCARI AI TRADING DASHBOARD"
          echo "========================================"

          ZIP_FILE=""

          for ZIP in ./*.zip; do
            [ -f "$ZIP" ] || continue

            echo "ZIP ditemukan: $ZIP"
            ZIP_FILE="$ZIP"
            break
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          echo ""
          echo "Extracting: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          APP_DIR="extracted/AI-Trading-Dashboard/artifacts/ai-trading-dashboard"

          if [ ! -f "$APP_DIR/package.json" ]; then
            echo ""
            echo "ERROR: Project AI Trading Dashboard tidak ditemukan."
            echo ""
            echo "Struktur package.json yang ditemukan:"
            find extracted -type f -name "package.json" | sort
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "PROJECT YANG DIPILIH"
          echo "========================================"

          echo "$APP_DIR"

          echo ""
          echo "========================================"
          echo "MEMBERSIHKAN ROOT REPOSITORY"
          echo "========================================"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            ! -name "extracted" \
            -exec rm -rf {} +

          echo ""
          echo "========================================"
          echo "MENYALIN PROJECT QFX"
          echo "========================================"

          cp -a "$APP_DIR"/. ./

          echo ""
          echo "Project QFX berhasil disalin."

          echo ""
          echo "========================================"
          echo "MENYALIN API CLIENT"
          echo "========================================"

          API_CLIENT_DIR="extracted/AI-Trading-Dashboard/lib/api-client-react"

          if [ ! -f "$API_CLIENT_DIR/package.json" ]; then
            echo "ERROR: api-client-react tidak ditemukan."
            exit 1
          fi

          mkdir -p lib/api-client-react

          cp -a "$API_CLIENT_DIR"/. lib/api-client-react/

          echo "api-client-react berhasil disalin."

      - name: Prepare package.json
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "MEMPERBAIKI DEPENDENCY"
          echo "========================================"

          node <<'NODE'
          const fs = require("fs");
          const { execSync } = require("child_process");

          function fixPackage(file) {
            console.log("");
            console.log(`Memproses ${file}`);

            const pkg = JSON.parse(
              fs.readFileSync(file, "utf8")
            );

            const sections = [
              "dependencies",
              "devDependencies",
              "optionalDependencies"
            ];

            for (const section of sections) {
              if (!pkg[section]) {
                continue;
              }

              for (const [name, value] of Object.entries(pkg[section])) {

                if (value === "workspace:*") {
                  if (name === "@workspace/api-client-react") {
                    pkg[section][name] =
                      "file:./lib/api-client-react";

                    console.log(
                      `${name} -> file:./lib/api-client-react`
                    );
                  }

                  continue;
                }

                if (value !== "catalog:") {
                  continue;
                }

                console.log(
                  `Mencari versi npm untuk ${name}...`
                );

                const version = execSync(
                  `npm view "${name}" version`,
                  {
                    encoding: "utf8"
                  }
                ).trim();

                if (!version) {
                  throw new Error(
                    `Versi npm tidak ditemukan: ${name}`
                  );
                }

                pkg[section][name] = `^${version}`;

                console.log(
                  `${name} -> ^${version}`
                );
              }
            }

            fs.writeFileSync(
              file,
              JSON.stringify(pkg, null, 2) + "\n"
            );

            console.log(
              `${file} selesai diperbaiki.`
            );
          }

          fixPackage("package.json");

          if (
            fs.existsSync(
              "lib/api-client-react/package.json"
            )
          ) {
            fixPackage(
              "lib/api-client-react/package.json"
            );
          }
          NODE

          echo ""
          echo "Dependency selesai diperbaiki."

      - name: Fix TypeScript configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "MEMPERBAIKI TSCONFIG"
          echo "========================================"

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "useDefineForClassFields": true,
              "lib": [
                "ES2022",
                "DOM",
                "DOM.Iterable"
              ],
              "allowJs": false,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "strict": true,
              "forceConsistentCasingInFileNames": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "preserve",
              "incremental": true,
              "types": [
                "node",
                "vite/client"
              ],
              "baseUrl": ".",
              "paths": {
                "@/*": [
                  "./src/*"
                ]
              }
            },
            "include": [
              "src/**/*",
              "lib/**/*",
              "vite.config.ts"
            ],
            "exclude": [
              "node_modules",
              "build",
              "dist",
              "**/*.test.ts"
            ]
          }
          EOF

          echo "tsconfig.json selesai diperbaiki."

      - name: Verify QFX project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFIKASI PROJECT QFX"
          echo "========================================"

          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -f tsconfig.json
          test -f src/App.tsx
          test -f src/pages/dashboard.tsx
          test -f src/pages/history.tsx
          test -f src/pages/portfolio.tsx
          test -f src/pages/settings.tsx
          test -f src/components/smc-chart.tsx
          test -f lib/api-client-react/package.json
          test -f lib/api-client-react/src/index.ts
          test -f lib/api-client-react/src/generated/api.ts
          test -f lib/api-client-react/src/generated/api.schemas.ts

          echo "package.json                         OK"
          echo "index.html                           OK"
          echo "vite.config.ts                       OK"
          echo "tsconfig.json                        OK"
          echo "src/App.tsx                          OK"
          echo "src/pages/dashboard.tsx             OK"
          echo "src/pages/history.tsx               OK"
          echo "src/pages/portfolio.tsx             OK"
          echo "src/pages/settings.tsx              OK"
          echo "src/components/smc-chart.tsx        OK"
          echo "lib/api-client-react                OK"
          echo "api.ts                               OK"
          echo "api.schemas.ts                       OK"

          echo ""
          echo "========================================"
          echo "MEMASTIKAN BUKAN MOCKUP PREVIEW"
          echo "========================================"

          if grep -q "Component Preview Server" src/App.tsx; then
            echo "ERROR: src/App.tsx masih merupakan Mockup Preview Server."
            exit 1
          fi

          if grep -q "mockup-components" src/App.tsx; then
            echo "ERROR: src/App.tsx masih menggunakan mockup-components."
            exit 1
          fi

          if ! grep -q "DashboardPage" src/App.tsx; then
            echo "ERROR: DashboardPage tidak ditemukan di App.tsx."
            exit 1
          fi

          echo "App.tsx adalah aplikasi QFX."

          echo ""
          echo "========================================"
          echo "MEMASTIKAN CATALOG DEPENDENCY HILANG"
          echo "========================================"

          if grep -R "catalog:" package.json lib/api-client-react/package.json; then
            echo "ERROR: catalog dependency masih ditemukan."
            exit 1
          fi

          echo "Tidak ada catalog dependency."

          echo ""
          echo "========================================"
          echo "VERIFIKASI BERHASIL"
          echo "========================================"

      - name: Install dependencies and test build
        shell: bash
        env:
          PORT: "4173"
          BASE_PATH: "/"
        run: |
          set -e

          echo "========================================"
          echo "INSTALL DEPENDENCIES"
          echo "========================================"

          npm install --no-audit --no-fund

          echo ""
          echo "========================================"
          echo "BUILD QFX"
          echo "========================================"

          npm run build

          echo ""
          echo "========================================"
          echo "BUILD QFX BERHASIL"
          echo "========================================"

      - name: Commit prepared QFX project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "MENYIMPAN PROJECT QFX KE GITHUB"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk disimpan."
            exit 0
          fi

          git commit -m "Prepare QFX dashboard project"

          git pull --rebase origin main

          git push origin main

          echo ""
          echo "========================================"
          echo "QFX PROJECT SIAP"
          echo "========================================"
