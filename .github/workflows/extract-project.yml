name: Prepare QFX Project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and extract application ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE=""

          while IFS= read -r -d '' file; do
            echo "Checking: $file"

            if unzip -l "$file" | grep -q "vite.config.ts" &&
               unzip -l "$file" | grep -q "index.html" &&
               unzip -l "$file" | grep -q "package.json"; then
              ZIP_FILE="$file"
              break
            fi
          done < <(find . -maxdepth 2 -type f -name "*.zip" -print0)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No suitable application ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -300

      - name: Remove nested Git metadata
        shell: bash
        run: |
          set -e

          find extracted -type d -name ".git" -prune -exec rm -rf {} +
          find extracted -type f -name ".gitmodules" -delete

          rm -rf .gitmodules

      - name: Locate Vite application
        shell: bash
        run: |
          set -e

          APP_DIR=""

          while IFS= read -r -d '' file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/index.html" ] &&
               [ -f "$DIR/package.json" ] &&
               [ -f "$DIR/vite.config.ts" ]; then
              APP_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name "vite.config.ts" -print0)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: Could not locate Vite application."
            exit 1
          fi

          echo "Application directory: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Find API client workspace package
        shell: bash
        run: |
          set -e

          API_PACKAGE_DIR=""

          while IFS= read -r -d '' file; do
            NAME="$(node -e '
              const fs=require("fs");
              try {
                const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                process.stdout.write(p.name || "");
              } catch(e) {}
            ' "$file")"

            if [ "$NAME" = "@workspace/api-client-react" ]; then
              API_PACKAGE_DIR="$(dirname "$file")"
              break
            fi
          done < <(find extracted -type f -name "package.json" -not -path "*/node_modules/*" -print0)

          if [ -z "$API_PACKAGE_DIR" ]; then
            echo "ERROR: @workspace/api-client-react was not found inside the ZIP."
            echo ""
            echo "Available package.json files:"
            find extracted -type f -name "package.json" -not -path "*/node_modules/*" -print
            exit 1
          fi

          echo "Found API client:"
          echo "$API_PACKAGE_DIR"

          rm -rf packages/api-client-react
          mkdir -p packages

          cp -R "$API_PACKAGE_DIR" packages/api-client-react

          echo "API_PACKAGE_DIR=$API_PACKAGE_DIR" >> "$GITHUB_ENV"

      - name: Copy application to repository root
        shell: bash
        run: |
          set -e

          # Preserve important repository files.
          mkdir -p .qfx-preserve

          [ -f package.json ] && cp package.json .qfx-preserve/old-package.json || true
          [ -f tsconfig.json ] && cp tsconfig.json .qfx-preserve/old-tsconfig.json || true

          # Remove previous application files.
          find . -maxdepth 1 \
            ! -name "." \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".gitignore" \
            ! -name ".qfx-preserve" \
            ! -name "AI-Trading-Dashboard.zip" \
            ! -name "packages" \
            -exec rm -rf {} +

          # Copy application.
          cp -R "$APP_DIR"/. .

          # Restore API client package.
          mkdir -p packages
          rm -rf packages/api-client-react
          cp -R "$API_PACKAGE_DIR" packages/api-client-react

          # Remove nested Git metadata.
          find . -type d -name ".git" -prune -not -path "./.git" -exec rm -rf {} +
          find . -type f -name ".gitmodules" -not -path "./.git/*" -delete

      - name: Fix workspace dependency
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require("fs");

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

          const sections = [
            "dependencies",
            "devDependencies",
            "optionalDependencies"
          ];

          let found = false;

          for (const section of sections) {
            if (
              pkg[section] &&
              pkg[section]["@workspace/api-client-react"]
            ) {
              pkg[section]["@workspace/api-client-react"] =
                "file:./packages/api-client-react";
              found = true;
            }
          }

          if (!found) {
            console.log(
              "WARNING: @workspace/api-client-react dependency was not present."
            );
          }

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );
          NODE

          echo "Updated package.json:"
          grep -n "api-client-react" package.json || true

      - name: Remove unsupported workspace dependencies from API client
        shell: bash
        run: |
          set -e

          if [ -f packages/api-client-react/package.json ]; then
            node <<'NODE'
            const fs = require("fs");

            const file = "packages/api-client-react/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

            const sections = [
              "dependencies",
              "devDependencies",
              "optionalDependencies",
              "peerDependencies"
            ];

            for (const section of sections) {
              if (!pkg[section]) continue;

              for (const [name, value] of Object.entries(pkg[section])) {
                if (
                  typeof value === "string" &&
                  value.startsWith("workspace:")
                ) {
                  console.log(
                    `Found workspace dependency in API client: ${name}=${value}`
                  );

                  if (name === "@workspace/api-zod") {
                    console.log(
                      "Removing optional workspace api-zod dependency."
                    );
                    delete pkg[section][name];
                  }
                }
              }
            }

            fs.writeFileSync(
              file,
              JSON.stringify(pkg, null, 2) + "\n"
            );
            NODE
          fi

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "=== Root files ==="
          ls -la

          echo ""
          echo "=== Source files ==="
          find src -maxdepth 3 -type f | sort | head -300

          echo ""
          echo "=== API client ==="
          find packages/api-client-react -maxdepth 3 -type f | sort | head -200

          echo ""
          echo "=== Workspace references ==="
          grep -R "workspace:" \
            package.json \
            packages/api-client-react/package.json \
            2>/dev/null || true

          test -f package.json
          test -f index.html
          test -f vite.config.ts
          test -d src
          test -f packages/api-client-react/package.json

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Test TypeScript
        run: |
          npm run typecheck

      - name: Test production build
        run: |
          npm run build

      - name: Remove temporary extraction
        shell: bash
        run: |
          rm -rf extracted
          rm -rf .qfx-preserve

      - name: Commit prepared project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Prepare QFX dashboard for Cloudflare"
            git push
          fi
