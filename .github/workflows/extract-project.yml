name: Prepare QFX Project

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract QFX dashboard
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MENCARI AI TRADING DASHBOARD"
          echo "=========================================="

          rm -rf extracted
          mkdir -p extracted

          FOUND_ZIP=""

          for ZIP in ./*.zip; do
            [ -f "$ZIP" ] || continue

            echo ""
            echo "Memeriksa ZIP: $ZIP"

            rm -rf testzip
            mkdir -p testzip

            unzip -q "$ZIP" -d testzip

            # Cari project yang mempunyai file Vite
            CANDIDATE=$(find testzip \
              -type f \
              \( -name "vite.config.ts" -o -name "vite.config.js" \) \
              -print -quit)

            if [ -n "$CANDIDATE" ]; then
              FOUND_ZIP="$ZIP"
              echo "ZIP cocok ditemukan: $ZIP"
              echo "Vite config: $CANDIDATE"
              break
            fi
          done

          if [ -z "$FOUND_ZIP" ]; then
            echo "ERROR: Tidak menemukan ZIP project QFX."
            exit 1
          fi

          rm -rf testzip
          mkdir -p extracted

          echo ""
          echo "Mengekstrak:"
          echo "$FOUND_ZIP"

          unzip -q "$FOUND_ZIP" -d extracted

          echo ""
          echo "Mencari folder project..."

          APP_DIR=""

          # Prioritas 1:
          # project yang mempunyai dashboard.tsx
          while IFS= read -r DASHBOARD_FILE; do
            DIR="$(dirname "$DASHBOARD_FILE")"

            while [ "$DIR" != "." ] && [ "$DIR" != "/" ]; do
              if [ -f "$DIR/package.json" ] && \
                 [ -f "$DIR/index.html" ] && \
                 { [ -f "$DIR/vite.config.ts" ] || [ -f "$DIR/vite.config.js" ]; }; then

                APP_DIR="$DIR"
                break 2
              fi

              DIR="$(dirname "$DIR")"
            done
          done < <(find extracted -type f -path "*/src/pages/dashboard.tsx")

          # Prioritas 2:
          # project Vite biasa
          if [ -z "$APP_DIR" ]; then
            while IFS= read -r VITE_FILE; do
              DIR="$(dirname "$VITE_FILE")"

              if [ -f "$DIR/package.json" ] && \
                 [ -f "$DIR/index.html" ]; then
                APP_DIR="$DIR"
                break
              fi
            done < <(
              find extracted -type f \
              \( -name "vite.config.ts" -o -name "vite.config.js" \)
            )
          fi

          if [ -z "$APP_DIR" ]; then
            echo ""
            echo "ERROR: Folder project QFX tidak ditemukan."
            echo ""
            echo "Isi extracted:"
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PROJECT DITEMUKAN"
          echo "=========================================="
          echo "$APP_DIR"

          echo ""
          echo "File penting:"
          find "$APP_DIR" -maxdepth 3 -type f \
            \( -name "package.json" \
            -o -name "index.html" \
            -o -name "vite.config.ts" \
            -o -name "tsconfig.json" \
            -o -name "dashboard.tsx" \
            \) \
            -print

          echo ""
          echo "=========================================="
          echo "MENYALIN PROJECT QFX KE ROOT REPOSITORY"
          echo "=========================================="

          # Bersihkan file project lama,
          # tetapi jangan menghapus .git atau workflow.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            ! -name "extracted" \
            -exec rm -rf {} +

          cp -a "$APP_DIR"/. ./

          echo ""
          echo "Project berhasil disalin."

      - name: Prepare package.json
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MEMERIKSA PACKAGE.JSON"
          echo "=========================================="

          test -f package.json

          node <<'NODE'
          const fs = require("fs");

          const file = "package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));

          const sections = [
            "dependencies",
            "devDependencies",
            "optionalDependencies"
          ];

          for (const section of sections) {
            if (!pkg[section]) continue;

            for (const [name, value] of Object.entries(pkg[section])) {
              if (value === "catalog:") {
                console.log(`catalog ditemukan: ${name}`);

                // Gunakan versi terbaru dari npm.
                const { execSync } = require("child_process");

                const version = execSync(
                  `npm view "${name}" version`,
                  {
                    encoding: "utf8"
                  }
                ).trim();

                if (!version) {
                  throw new Error(
                    `Tidak dapat menemukan versi npm untuk ${name}`
                  );
                }

                pkg[section][name] = `^${version}`;

                console.log(
                  `${name}: catalog: -> ^${version}`
                );
              }
            }
          }

          fs.writeFileSync(
            file,
            JSON.stringify(pkg, null, 2) + "\n"
          );

          console.log("package.json selesai diperiksa.");
          NODE

          echo ""
          echo "Memastikan tidak ada catalog:"

          if grep -R '"catalog:"' package.json; then
            echo "ERROR: catalog masih ditemukan."
            exit 1
          fi

          echo "Tidak ada catalog: lagi."

      - name: Fix TypeScript configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MEMERIKSA TSCONFIG"
          echo "=========================================="

          if [ -f tsconfig.json ]; then
            echo "tsconfig.json ditemukan."

            if grep -q '"extends"' tsconfig.json; then
              echo "Menggunakan tsconfig project yang ada."
            else
              echo "tsconfig tidak memakai extends."
            fi
          else
            echo "tsconfig.json belum ada."
            echo "Membuat konfigurasi TypeScript dasar."

            cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "useDefineForClassFields": true,
              "lib": [
                "ES2022",
                "DOM",
                "DOM.Iterable"
              ],
              "allowJs": false,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "strict": true,
              "forceConsistentCasingInFileNames": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "incremental": true,
              "types": [
                "node",
                "vite/client"
              ],
              "baseUrl": ".",
              "paths": {
                "@/*": [
                  "./src/*"
                ]
              }
            },
            "include": [
              "src/**/*",
              "mockupPreviewPlugin.ts",
              "vite.config.ts"
            ],
            "exclude": [
              "node_modules",
              "build",
              "dist",
              "**/*.test.ts"
            ]
          }
          EOF
          fi

      - name: Verify QFX project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFIKASI PROJECT QFX"
          echo "=========================================="

          test -f package.json
          test -f index.html
          test -d src

          echo ""
          echo "package.json OK"
          echo "index.html OK"
          echo "src/ OK"

          if [ -f vite.config.ts ]; then
            echo "vite.config.ts OK"
          elif [ -f vite.config.js ]; then
            echo "vite.config.js OK"
          else
            echo "ERROR: vite.config tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "Mencari dashboard.tsx:"

          DASHBOARD=$(find src -type f -name "dashboard.tsx" -print -quit || true)

          if [ -n "$DASHBOARD" ]; then
            echo "DASHBOARD DITEMUKAN:"
            echo "$DASHBOARD"
          else
            echo "dashboard.tsx belum ditemukan."
          fi

          echo ""
          echo "Struktur src:"
          find src -maxdepth 3 -type f | sort | head -200

          echo ""
          echo "=========================================="
          echo "VERIFIKASI BERHASIL"
          echo "=========================================="

      - name: Commit prepared project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Prepare QFX project"

          git pull --rebase origin main

          git push origin main

          echo ""
          echo "=========================================="
          echo "PROJECT QFX SIAP"
          echo "=========================================="
