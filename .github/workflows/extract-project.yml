name: Extract QFX Project

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find actual QFX app
        shell: bash
        run: |
          set -e

          rm -rf extracted testzip
          mkdir extracted testzip

          FOUND=""

          for ZIP in *.zip; do
            [ -f "$ZIP" ] || continue

            echo "Memeriksa $ZIP"
            rm -rf testzip
            mkdir testzip

            unzip -q "$ZIP" -d testzip

            CANDIDATE=$(find testzip -type f -name "vite.config.ts" -printf '%h\n' | while read DIR; do
              if [ -f "$DIR/index.html" ] && [ -f "$DIR/package.json" ]; then
                echo "$DIR"
                break
              fi
            done | head -n 1)

            if [ -n "$CANDIDATE" ]; then
              FOUND="$ZIP"
              APP_DIR="$CANDIDATE"
              echo "APP DITEMUKAN: $ZIP"
              echo "FOLDER: $APP_DIR"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "ERROR: Aplikasi Vite QFX tidak ditemukan."
            echo "ZIP yang tersedia:"
            ls -lh *.zip 2>/dev/null || true
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -q "$FOUND" -d extracted

          APP_DIR=$(find extracted -type f -name "vite.config.ts" -printf '%h\n' | while read DIR; do
            if [ -f "$DIR/index.html" ] && [ -f "$DIR/package.json" ]; then
              echo "$DIR"
              break
            fi
          done | head -n 1)

          echo "Mengambil project dari: $APP_DIR"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "*.zip" \
            -exec rm -rf {} +

          cp -a "$APP_DIR"/. ./

          rm -rf extracted testzip

          echo "Project QFX berhasil diekstrak."

      - name: Commit
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Fix QFX project root"
          git pull --rebase origin main
          git push origin main
